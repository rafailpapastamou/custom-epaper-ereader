; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitm-1]
platform = espressif32
board = esp32-s3-devkitm-1
upload_port = /dev/cu.usbmodem5B901860471
framework = arduino
monitor_speed = 115200
board_build.arduino.memory_type = opi_opi
board_upload.flash_size = 32MB
board_build.partitions = default_16MB.csv
build_flags = 
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DBOARD_HAS_PSRAM
	-Dtinfl_decompress=mz_tinfl_decompress
  -Dtinfl_decompress_mem_to_heap=mz_tinfl_decompress_mem_to_heap
  -Dtinfl_decompress_mem_to_mem=mz_tinfl_decompress_mem_to_mem
  -Dtinfl_decompress_mem_to_callback=mz_tinfl_decompress_mem_to_callback
  -Dtdefl_compress=mz_tdefl_compress
  -Dtdefl_compress_buffer=mz_tdefl_compress_buffer
  -Dtdefl_init=mz_tdefl_init
  -Dtdefl_get_prev_return_status=mz_tdefl_get_prev_return_status
  -Dtdefl_get_adler32=mz_tdefl_get_adler32
  -Dtdefl_compress_mem_to_output=mz_tdefl_compress_mem_to_output
  -Dtdefl_compress_mem_to_heap=mz_tdefl_compress_mem_to_heap
  -Dtdefl_compress_mem_to_mem=mz_tdefl_compress_mem_to_mem
  -DARDUINO_USB_MODE=0
lib_deps = 
	zinggjm/GxEPD2@^1.6.9
	olikraus/U8g2_for_Adafruit_GFX@^1.8.0
	sepastian/tinyxml2@^11.0.0
monitor_filters = esp32_exception_decoder
build_type = debug